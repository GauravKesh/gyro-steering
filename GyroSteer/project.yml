name: GyroSteer
options:
  bundleIdPrefix: com.gyrosteer
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "13.0"
    iOS: "16.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CLANG_ENABLE_MODULES: YES
    SWIFT_OPTIMIZATION_LEVEL: "-O"

targets:
  GyroSteerShared:
    type: framework
    platform: macOS
    supportedDestinations: [macOS, iOS]
    sources:
      - path: Shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.gyrosteer.shared
      DEFINES_MODULE: YES

  GyroSteer-Mac:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: GyroSteer-Mac
        excludes:
          - "Resources/Info.plist"
          - "Resources/GyroSteer-Mac.entitlements"
      - path: Shared
    settings:
      PRODUCT_NAME: "GyroSteer"
      PRODUCT_BUNDLE_IDENTIFIER: com.gyrosteer.receiver
      INFOPLIST_FILE: GyroSteer-Mac/Resources/Info.plist
      CODE_SIGN_ENTITLEMENTS: GyroSteer-Mac/Resources/GyroSteer-Mac.entitlements
      ENABLE_HARDENED_RUNTIME: YES
      COMBINE_HIDPI_IMAGES: YES
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - framework: Network.framework
      - framework: CoreBluetooth.framework
      - framework: CoreGraphics.framework
      - framework: IOKit.framework
      - framework: AppKit.framework
      - framework: SwiftUI.framework

  GyroSteer-iOS:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: GyroSteer-iOS
        excludes:
          - "Resources/Info.plist"
      - path: Shared
    settings:
      PRODUCT_NAME: "GyroSteer"
      PRODUCT_BUNDLE_IDENTIFIER: com.gyrosteer.transmitter
      INFOPLIST_FILE: GyroSteer-iOS/Resources/Info.plist
      TARGETED_DEVICE_FAMILY: "1,2"
      ENABLE_BITCODE: NO
      SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - framework: Network.framework
      - framework: CoreBluetooth.framework
      - framework: CoreMotion.framework
      - framework: UIKit.framework
      - framework: SwiftUI.framework

  GyroSteerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Shared
      - path: GyroSteer-Mac
        excludes:
          - "App/GyroSteerMacApp.swift"
          - "Resources/**"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.gyrosteer.tests
    dependencies:
      - target: GyroSteer-Mac
